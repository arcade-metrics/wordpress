# Deploy (spec 08, ADR 0005): merge no main → imagem no GHCR → SSM na ciatec-games → server/deploy.sh.
# Reversão: Actions → Deploy → Run workflow → tag anterior (ex.: sha-abc1234).
#
# Pré-requisitos (humano, F4 — ver docs/runbooks):
#   vars.AWS_DEPLOY_ROLE_ARN   papel IAM com trust OIDC para este repo/branch e só ssm:SendCommand nesta instância
#   vars.DEPLOY_INSTANCE_ID    id da ciatec-games
#   environment "production"   com aprovação obrigatória
#   servidor provisionado (server/provision.sh, env-from-ssm.sh, install-nginx.sh)
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já publicada para (re)implantar, ex.: sha-abc1234. Vazio = build do commit atual."
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arcade-metrics/wordpress
  AWS_REGION: us-east-2

jobs:
  ci:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/Dockerfile
          push: true
          build-args: |
            RELEASE=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Só roda quando o acesso à AWS estiver configurado (vars do repositório); até lá o workflow só publica a imagem.
    if: ${{ always() && vars.AWS_DEPLOY_ROLE_ARN != '' && (needs.build.result == 'success' || inputs.tag) }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - id: tag
        run: echo "tag=${{ inputs.tag || needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy via SSM
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          INSTANCE: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          # O servidor extrai o bundle da própria imagem e roda o deploy.sh dela.
          script="set -e; docker pull -q ${IMAGE}:${TAG}; d=\$(mktemp -d); docker run --rm --entrypoint tar ${IMAGE}:${TAG} -C /opt/stack -c server | tar -x -C \$d; bash \$d/server/deploy.sh ${TAG}"
          params="$(jq -cn --arg s "$script" '{commands: [$s], executionTimeout: ["900"]}')"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
                  --comment "wordpress deploy ${TAG}" --parameters "$params" --query Command.CommandId --output text)"
          echo "SSM command: $cid"
          aws ssm wait command-executed --command-id "$cid" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json \
            | tee result.json
          test "$(jq -r .Status result.json)" = Success
