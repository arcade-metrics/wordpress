# CI: roda em todo PR. Lint + scripts/test-local.sh (fluxo 1, igual ao local). O deploy (fluxo 2) é o deploy.yml.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell
        run: |
          shopt -s globstar
          bash -n scripts/*.sh server/**/*.sh platform/**/*.sh
          shellcheck -S warning scripts/*.sh server/**/*.sh platform/**/*.sh
      - name: PHP
        run: find platform sites -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Compose
        run: |
          docker compose config -q
          IMAGE_TAG=x DB_PASSWORD=x DB_ROOT_PASSWORD=x WORDPRESS_AUTH_KEY=x WORDPRESS_SECURE_AUTH_KEY=x \
          WORDPRESS_LOGGED_IN_KEY=x WORDPRESS_NONCE_KEY=x WORDPRESS_AUTH_SALT=x WORDPRESS_SECURE_AUTH_SALT=x \
          WORDPRESS_LOGGED_IN_SALT=x WORDPRESS_NONCE_SALT=x docker compose -f deploy/compose.yml config -q

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Teste local (o mesmo script que se roda na máquina)
        run: bash scripts/test-local.sh
      - name: Memória dos containers
        if: always()
        run: docker stats --no-stream
      - name: Logs
        if: failure()
        run: docker compose logs --tail=200
