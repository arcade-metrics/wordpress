# Rede WordPress (arcade-metrics/wordpress, server/nginx). Instalado por install-nginx.sh — não editar no servidor.

server {
    listen 80;
    listen [::]:80;
    server_name hint.ciatec.org;
    return 301 https://hint.ciatec.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hint.ciatec.org;
    ssl_certificate     /etc/letsencrypt/live/hint.ciatec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hint.ciatec.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/wordpress-proxy.conf;
}
