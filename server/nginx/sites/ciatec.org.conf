# Rede WordPress (arcade-metrics/wordpress, server/nginx). Instalado por install-nginx.sh — não editar no servidor.
# Sem http2: no Nginx 1.24 ligá-lo no listen vale para todos os blocos da porta 443, inclusive os dos jogos.

server {
    listen 80;
    listen [::]:80;
    server_name ciatec.org www.ciatec.org;
    return 301 https://ciatec.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ciatec.org;
    ssl_certificate     /etc/letsencrypt/live/ciatec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciatec.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://ciatec.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ciatec.org;
    ssl_certificate     /etc/letsencrypt/live/ciatec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciatec.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/wordpress-proxy.conf;
}
