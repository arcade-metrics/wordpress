# Rede WordPress (arcade-metrics/wordpress, server/nginx). Incluído pelos blocos HTTPS de cada site.
client_max_body_size 32m;

# Sem cache para quem está logado, para POST e para o admin/API.
set $wp_skip_cache 0;
if ($request_method !~ ^(GET|HEAD)$) { set $wp_skip_cache 1; }
if ($http_cookie ~* "wordpress_logged_in|wordpress_sec|wp-postpass|comment_author") { set $wp_skip_cache 1; }
if ($request_uri ~* "^/(wp-admin|wp-login\.php|wp-json|wp-cron\.php|xmlrpc\.php)|[?&]preview=") { set $wp_skip_cache 1; }

location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache wordpress;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 301 5m;
    proxy_cache_bypass $wp_skip_cache;
    proxy_no_cache $wp_skip_cache;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
}

# Arquivos estáticos do tema/uploads: cache longo no navegador (o tema versiona CSS/JS com ?ver=).
location ~* ^/wp-(content|includes)/.+\.(css|js|svg|png|jpe?g|webp|gif|ico|woff2?|mp4)$ {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache wordpress;
    proxy_cache_valid 200 1h;
    expires 30d;
    add_header Cache-Control "public";
}
