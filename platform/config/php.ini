; Orçamento de memória: spec 01.
memory_limit = 128M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 8000
; código imutável na imagem: não precisa revalidar arquivos (em dev o compose.yaml liga de volta)
opcache.validate_timestamps = 0
